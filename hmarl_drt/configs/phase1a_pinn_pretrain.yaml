# Phase 1a: PINN Pre-Training Config
# Trains PINN agent on physics simulation trajectories (200 eps, 50 per regime)

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    sample_regime_each_episode: true
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.25, 0.25, 0.25, 0.25]

agents:
  pinn:
    hidden_dim: 128
    lr: 1.0e-3
    lambda_ode: 1.0
    lambda_bc: 0.1

training:
  n_episodes: 200
  save_freq: 50

logging:
  log_dir: "runs/phase1a_pinn/"

device: "auto"
seed: 42
