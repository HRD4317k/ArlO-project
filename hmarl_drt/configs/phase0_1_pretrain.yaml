# Phase 0-1: Component Pre-Training
# PINN + GP + PEARL + SAC pre-training
# No CEMRL, no EWC, single regime (healthy)

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    sample_regime_each_episode: true
    initial_delta_min: 0.0
    initial_delta_max: 0.2
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.40, 0.30, 0.20, 0.10]

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 1.0e-3
    lambda_ode: 1.0
    lambda_bc: 0.1
  gp:
    kernel: "matern52"
    n_inducing: 100
    lr: 0.01
  fm:
    model_name: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 256
    confidence_threshold: 0.7
    use_api: false
    api_timeout_s: 8.0
    api_interval: 50

embedding:
  shared_dim: 64
  agent_dims: [64, 32, 128, 64]
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 5.0e-4
  eta: 0.7
  min_nn_weight: 0.80
  min_nn_weight_initial: 0.80
  curriculum_episodes: 1

reward:
  initial_weights:
    energy: 0.12
    rul: 0.12
    safety: 0.55
    physics: 0.16
    curiosity: 0.05
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000
  curiosity_norm: 100.0

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 200
  batch_size: 256
  buffer_size: 100000
  update_freq: 4
  warmup_steps: 500

cemrl:
  enabled: false
  use_latent_regime_detection: false
  mask_true_delta: false
  expose_true_delta_for_eval: true

logging:
  log_dir: "runs/phase0_1_pretrain/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10
  save_freq: 50

device: "auto"
seed: 42
