agents:
  fm:
    confidence_threshold: 0.7
    max_tokens: 256
    model_name: gpt-4o-mini
    temperature: 0.3
  gp:
    kernel: matern52
    lr: 0.01
    n_inducing: 100
  pinn:
    hidden_dim: 128
    lambda_bc: 0.1
    lambda_ode: 1.0
    lr: 0.001
  sac:
    alpha: 0.2
    auto_entropy: true
    gamma: 0.99
    hidden_dim: 256
    lr_actor: 0.0003
    lr_critic: 0.0003
    tau: 0.005
arbiter:
  eta: 0.7
  hidden_dim: 128
  lr: 0.001
  temperature: 1.0
device: auto
embedding:
  agent_dims:
  - 64
  - 32
  - 128
  - 64
  lambda_orth: 0.01
  n_agents: 4
  shared_dim: 64
env:
  action_dim: 3
  constraints:
    T_max: 100.0
    delta_crit: 0.9
    omega_max: 1.5
    omega_min: 0.5
  dt: 0.1
  max_steps: 1000
  n_turbines: 1
  name: WindTurbine-v0
  physics:
    B: 100.0
    C_th: 5000.0
    J: 1000000.0
    R: 40.0
    h_conv: 10.0
    rho: 1.225
  state_dim: 8
ipae:
  encoder_hidden: 128
  lambda_kl: 0.01
  lambda_mono: 0.5
  lambda_physics: 1.0
  lambda_rul: 1.0
  latent_dim: 8
  lstm_hidden: 256
  lstm_layers: 2
  mc_dropout: 0.1
  n_features: 14
  n_mc_samples: 50
  pretrain_epochs: 200
  pretrain_lr: 0.001
  rul_hidden:
  - 64
  - 32
  - 16
  window_size: 64
logging:
  log_dir: runs/dashboard_demo/
  print_freq: 5
  use_tensorboard: true
  use_wandb: false
reward:
  alpha_rul: 0.01
  initial_weights:
    curiosity: 0.1
    energy: 0.1
    physics: 0.3
    rul: 0.2
    safety: 0.3
  kappa: 0.1
  lambda_entropy: 0.01
  phase_late_step: 150000
  phase_mid_step: 50000
seed: 42
training:
  batch_size: 32
  buffer_size: 1000000
  eval_freq: 50
  n_episodes: 50
  save_freq: 100
  update_freq: 4
  warmup_steps: 100
transfer:
  fm_confidence_threshold: 0.7
  lambda_fm: 0.02
  lambda_gn: 0.05
  lambda_ng: 0.05
  lambda_np: 0.1
  lambda_pn: 0.1
