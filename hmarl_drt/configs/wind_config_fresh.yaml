# HMARL-DRT Configuration — Wind Turbine Farm
# ================================================

# Disable the broken AsyncVectorEnv: the implementation creates 8 parallel workers
# but only uses env[0]'s observations, wasting ~7/8 of IPC bandwidth while
# discarding valid experience from workers 1-7. Use a single environment.
use_async_env: false

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1                    # Simulation timestep (s)
  max_steps: 1000            # Steps per episode

  # Parallel environment settings
  # Reduced parallel environments to lower CPU/GPU overhead while still
  # providing sufficient data diversity. 8 environments give a good speed‑
  # memory trade‑off on typical GPU machines.
  num_envs: 8

  # Turbine physical parameters
  physics:
    J: 1000000.0              # Moment of inertia (kg·m²)
    B: 100.0                 # Friction coefficient
    R: 40.0                  # Rotor radius (m)
    rho: 1.225               # Air density (kg/m³)
    C_th: 5000.0             # Thermal capacitance
    h_conv: 1000.0           # Convective heat transfer coeff (W/K). Must match code default.
                             # With h_conv=10 (old), equilibrium T=2525°C >> T_max=100°C → 99.4% violations.
    # FIX: Reduced from 5.0 to 1.5 for regime diversity.
    # With 5.0, episodes reach emergency (δ>0.75) within 200 steps,
    # preventing training in healthy/degrading/critical regimes.
    # 1.5x allows ~400 steps per regime transition, giving agents
    # experience across all 4 regimes within each episode.
    deg_acceleration: 1.5

  # Constraint limits
  constraints:
    omega_min: 0.5           # Min rotor angular velocity (rad/s)
    omega_max: 1.5           # Max rotor angular velocity (rad/s)
    T_max: 100.0             # Max bearing temperature (°C)
    delta_crit: 0.9          # Critical degradation index

  # Degradation curriculum: balanced regime sampling so each regime
  # gets equal training exposure (prevents regime imbalance bias).
  degradation:
    enabled: true
    sample_regime_each_episode: true   # Sample random regime at episode start
    initial_delta_min: 0.0
    initial_delta_max: 0.2
    regime_probs: [0.25, 0.25, 0.25, 0.25]  # Balanced (was [0.5,0.25,0.2,0.05])
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.5]
      "2": [0.5, 0.75]
      "3": [0.75, 0.95]

  # State space: [omega, v_wind, T_gen, T_bearing, P_out, delta, grid_demand, weather]
  state_dim: 8
  action_dim: 3              # [beta (pitch), torque_setpoint_delta, maintenance_flag]

# Agent configurations
agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2               # Initial entropy coefficient
    auto_entropy: true

  pinn:
    hidden_dim: 128
    lr: 1.0e-3
    lambda_ode: 1.0
    lambda_bc: 0.1

  gp:
    kernel: "matern52"
    n_inducing: 100
    lr: 0.01

  fm:
    model_name: "gpt-oss-120b"
    # When true (default) FM provides incremental adjustments; set false to
    # have FM directly override reward weights.
    # Set to false to have the FM agent directly suggest full reward weights
    # (and thus generate API response logs each interval).
    use_adjustments: true
    temperature: 0.3
    max_tokens: 256
    confidence_threshold: 0.7
    use_api: true
    api_timeout_s: 8.0
    # api_interval: every N steps the FM async API call is submitted.
    # 50 steps gives frequent weight suggestions without blocking the loop.
    api_interval: 50

# Core module configurations
embedding:
  shared_dim: 64
  agent_dims: [128, 32, 128, 64]   # NN (hidden_dim//2=128), GP/iPAE, FM, PINN
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1.0e-3
  eta: 0.7                   # Competence-uncertainty tradeoff

reward:
  initial_weights:
    energy: 0.09
    rul: 0.19
    safety: 0.28
    physics: 0.28
    curiosity: 0.09
    degradation: 0.05        # Continuous gradient from step 1; r = -delta_current
  # Reduced from 0.5 to 0.1:
  # With 0.5 and ~860 violations/ep: penalty = 430/ep = 91% of reward signal.
  # This drowns all other components and prevents SAC from learning what is "good".
  # With 0.1: penalty = 86/ep, letting energy (14/ep) + curiosity (29/ep) + RUL
  # provide meaningful gradient signal alongside the safety incentive.
  physics_violation_penalty: 0.1
  kappa: 0.1                 # FM pull strength
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000

transfer:
  lambda_pn: 0.1             # Physics → NN
  lambda_ng: 0.05            # NN → GP
  lambda_gn: 0.05            # GP → NN
  lambda_np: 0.1             # NN → Physics
  lambda_fm: 0.02            # FM → All
  fm_confidence_threshold: 0.7

# Training
training:
  n_episodes: 5000
  # Larger batch size reduces the number of optimizer steps per episode and
  # speeds up training. 24 k samples matches the setting used in the final
  # high‑quality run.
  batch_size: 128  # T2 — reduced from 24000 to prevent slowdown as buffer grows
  buffer_size: 1000000 #1000 T2
  update_freq: 4             # Steps between updates
  warmup_steps: 1000
  eval_freq: 50              # Episodes between eval
  save_freq: 100  # Warm-start from ep 400 checkpoint so the next run continues from
  # the current training progress after the fixes are applied.
  warm_start_checkpoint: null
# iPAE pre-training
ipae:
  latent_dim: 8
  window_size: 64
  n_features: 14
  encoder_hidden: 128
  lstm_hidden: 256
  lstm_layers: 2
  rul_hidden: [64, 32, 16]
  mc_dropout: 0.1
  n_mc_samples: 50
  pretrain_epochs: 200
  pretrain_lr: 1.0e-3
  lambda_physics: 1.0
  lambda_rul: 1.0
  lambda_mono: 0.5
  lambda_kl: 0.01

# Logging
logging:
  log_dir: "runs/fresh/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10

# Device
device: "auto"               # auto, cpu, cuda, mps
seed: 42

# ------------------------------------------------------------------
# CEMRL settings – enable for CEMRL runs (supervised testing)
# ------------------------------------------------------------------
cemrl:
  enabled: true
  # Use delta-threshold regime detection so regime diversity is correct from episode 0
  # while PEARL learns latent representations via dynamics prediction loss.
  # Switch to use_latent_regime_detection: true after PEARL has pre-trained.
  use_latent_regime_detection: false
  mask_true_delta: false
  expose_true_delta_for_eval: true
  allow_delta_bootstrap_fallback: true  # Safety fallback if delta unavailable
  n_latent_regimes: 4
  fisher_min_interval_steps: 3000
  pearl:
    embedding_dim: 32
    hidden_dim: 128
    context_window: 20
    lr: 3.0e-4
    freeze: false
    detect_confidence_threshold: 0.3
    detect_similarity_threshold: 0.10
    ema_alpha: 0.05
  ewc:
    lambda_base: 400.0
    beta_lambda: 0.1
    gamma_decay: 0.95
    freeze: false
  cemrl_arbiter:
    hidden_dim: 128
    alpha_inner: 0.005
    alpha_outer: 0.001
    delta_kl: 0.01
    n_inner_steps: 5          # Was 1 — critical fix for MAML adaptation quality
    meta_update_freq: 100
  regime_detector:
    # Increased from 10 to 30: requires 30 consecutive steps of the same regime
    # before confirming. More robust against sensor noise near threshold boundaries.
    hysteresis_buffer: 30
    # Increased from 50 to 200: minimum steps to stay in a regime after
    # a confirmed transition. Prevents rapid flip-flopping near delta thresholds
    # (0.3 and 0.7) which was a major source of spurious EWC/MAML triggers.
    dwell_steps: 200
  maml_warmstart:
    n_regimes: 4
    min_steps_before_save: 50
    blend_alpha: 0.80
