# HMARL-DRT — Fresh Full-Stack CEMRL Run (supervised regimes + iPAE)
# ===================================================================
# Differences vs wind_config_fresh.yaml:
#   * GP slot backend switched to iPAE (physics-informed autoencoder,
#     supervised RUL head) instead of the deep-ensemble "GP" agent.
#   * PEARL context encoder removed entirely. The task embedding is now
#     deterministic and supervised: one-hot(regime_id) + true delta.
#   * EWC penalty uses hard regime-id selection (previously it silently fell
#     back to equal weighting across all regimes, because regime centroids
#     were never populated).
#   * EWC Fisher values are clipped (fisher_clip) to fix the unbounded growth
#     that reached ~1e16 in the previous run's logs.
#   * FM agent config is now actually passed through to FMAgent (previously
#     the whole fm: block was ignored and the agent ran heuristics-only).
#   * Periodic checkpointing enabled (checkpoint_every).

use_async_env: false

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  num_envs: 8

  physics:
    # 4.0e7 is realistic for a 40 m rotor. At the previous 1.0e6 the aero
    # torque (up to 1.4e7 N.m) far exceeded the generator's 1e6 N.m of
    # authority, so |dOmega| per step reached 1.29 - wider than the entire
    # legal band [0.5, 1.5] - making rotor speed uncontrollable by any policy.
    J: 40000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
    deg_acceleration: 1.5

  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9

  degradation:
    enabled: true
    sample_regime_each_episode: true
    initial_delta_min: 0.0
    initial_delta_max: 0.2
    regime_probs: [0.25, 0.25, 0.25, 0.25]
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.5]
      "2": [0.5, 0.75]
      "3": [0.75, 0.95]

  state_dim: 8
  action_dim: 3

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true

  pinn:
    hidden_dim: 128
    lr: 1.0e-3
    lambda_ode: 1.0
    lambda_bc: 0.1

  # Agent 2 slot: iPAE backend (checkpoint/log keys keep the "gp" names for
  # backward compatibility with existing dashboards and validation scripts).
  gp:
    backend: ipae
    lr: 1.0e-3

  fm:
    model_name: "gpt-oss-120b"
    use_adjustments: true
    temperature: 0.3
    max_tokens: 256
    confidence_threshold: 0.7
    use_api: true
    api_timeout_s: 8.0
    api_interval: 50

embedding:
  shared_dim: 64
  agent_dims: [128, 32, 128, 64]   # NN, iPAE(32), FM, PINN
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1.0e-3
  eta: 0.7
  warning_caution: 0.5   # Graded pull toward PINN on sub-critical warnings
  safety_margin_frac: 0.15  # Anticipatory proximity-to-limit ramp width

reward:
  # Weights now encode true importance since components are normalized to
  # comparable scales (r_energy [0,1], r_rul [0,1], r_safety [-1,0],
  # r_physics [-1,0], r_curiosity [0,1], r_degradation [-1,0]).
  # Early training: safety + physics dominant (learn to stay in bounds).
  initial_weights:
    energy: 0.10
    rul: 0.15
    safety: 0.30
    physics: 0.20
    curiosity: 0.10
    degradation: 0.15   # Strong degradation penalty so SAC learns to slow it
  physics_violation_penalty: 0.1
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 5000
  batch_size: 256
  buffer_size: 1000000
  update_freq: 4
  warmup_steps: 1000
  eval_freq: 50
  save_freq: 100
  checkpoint_every: 100        # Periodic ep_XXXXX.pt + latest.pt snapshots
  warm_start_checkpoint: null  # Fully fresh run

# iPAE settings — adapted to this environment.
# n_features must equal state_dim (8); the original 14 came from the C-MAPSS
# sensor schema and has no counterpart in the wind-turbine observation space.
# window_size reduced 64 -> 20 so the rolling context fills quickly within an
# episode and online inference stays cheap.
ipae:
  latent_dim: 8
  window_size: 10
  n_features: 8
  encoder_hidden: 64
  lstm_hidden: 64
  lstm_layers: 1
  rul_hidden: [64, 32, 16]
  mc_dropout: 0.1
  n_mc_samples: 10       # Batched into a single pass, so cost is ~1 forward
  lambda_rul: 1.0
  lambda_kl: 0.01
  lambda_mono: 0.5       # Degradation latents must not decrease over time
  lambda_physics: 1.0    # Latent ODE residual

logging:
  log_dir: "runs/fresh_ipae_supervised/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10

device: "auto"
seed: 42

cemrl:
  enabled: true
  # Supervised regime detection from the true degradation index — no latent
  # (PEARL) regime inference anywhere in this run.
  use_latent_regime_detection: false
  mask_true_delta: false
  expose_true_delta_for_eval: true
  allow_delta_bootstrap_fallback: true
  n_latent_regimes: 4
  fisher_min_interval_steps: 3000

  # Dimensionality of the deterministic supervised task embedding
  # (one-hot regime + delta). Replaces pearl.embedding_dim.
  z_task_dim: 32

  ewc:
    lambda_base: 400.0
    beta_lambda: 0.1
    gamma_decay: 0.95
    fisher_clip: 10000.0      # Fixes unbounded Fisher growth (was ~1e16)
    freeze: false

  cemrl_arbiter:
    hidden_dim: 128
    alpha_inner: 0.005
    alpha_outer: 0.001
    delta_kl: 0.01
    n_inner_steps: 5
    meta_update_freq: 100
    entropy_coef: 0.01       # Guards against gating collapse onto one agent

  regime_detector:
    hysteresis_buffer: 30
    dwell_steps: 200

  maml_warmstart:
    n_regimes: 4
    min_steps_before_save: 50
    blend_alpha: 0.80
