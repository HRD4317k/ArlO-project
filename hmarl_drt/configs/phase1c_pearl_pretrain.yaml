# Phase 1c: PEARL Context Encoder Pre-Training Config
# Trains PEARL on labeled regime transition sequences (500 eps)

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    sample_regime_each_episode: true
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.25, 0.25, 0.25, 0.25]

cemrl:
  pearl:
    embedding_dim: 32
    hidden_dim: 128
    context_window: 20
    lr: 3.0e-4

training:
  n_episodes: 500
  save_freq: 100

logging:
  log_dir: "runs/phase1c_pearl/"

device: "auto"
seed: 42
