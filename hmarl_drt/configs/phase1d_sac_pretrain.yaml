# Phase 1d: SAC Agent Pre-Training Config
# Trains SAC with regime-specific heads (400 eps, 100 per regime)

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    sample_regime_each_episode: true
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.25, 0.25, 0.25, 0.25]

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true

embedding:
  shared_dim: 64
  agent_dims: [128, 32, 128, 64]
  n_agents: 4
  lambda_orth: 0.01

training:
  n_episodes: 400
  batch_size: 256
  buffer_size: 100000
  update_freq: 4
  warmup_steps: 500
  save_freq: 100

logging:
  log_dir: "runs/phase1d_sac/"

device: "auto"
seed: 42
