# Phase 4 – CEMRL fine‑tuning with latent regime detection

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    sample_regime_each_episode: true
    initial_delta_min: 0.0
    initial_delta_max: 0.2
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.40, 0.30, 0.20, 0.10]

agents:
  sac:
    hidden_dim: 256
    lr_actor: 1.0e-4
    lr_critic: 1.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 5.0e-4
    lambda_ode: 1.0
    lambda_bc: 0.1
  gp:
    kernel: "matern52"
    n_inducing: 100
    lr: 0.005
  fm:
    model_name: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 256
    confidence_threshold: 0.7
    use_api: false
    api_timeout_s: 8.0
    api_interval: 50
    # When true (default), FM provides small weight adjustments during CEMRL.
    # Set to false to have FM directly override reward weights via absolute
    # suggestions (as in earlier phases).
    use_adjustments: true

embedding:
  shared_dim: 64
  agent_dims: [64, 32, 128, 64]
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 3.0e-4
  eta: 0.7
  min_nn_weight: 0.10
  min_nn_weight_initial: 0.10
  curriculum_episodes: 1

reward:
  initial_weights:
    energy: 0.12
    rul: 0.12
    safety: 0.55
    physics: 0.16
    curiosity: 0.05
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000
  curiosity_norm: 100.0

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 800
  batch_size: 128
  buffer_size: 200000
  update_freq: 4
  warmup_steps: 500
  eval_freq: 50
  save_freq: 100
  # Use the checkpoint from Phase 3 that we have identified as suitable for consolidation.
  # This path can be overridden via the command‑line argument `--ckpt` when invoking `run_phase4.py`.
  warm_start_checkpoint: "runs/wind_cemrl_phase3_from_500/checkpoints/ep_02200.pt"

cemrl:
  enabled: true
  use_latent_regime_detection: true
  mask_true_delta: false
  expose_true_delta_for_eval: true
  # ---- Consolidation‑specific hyper‑parameters ----
  ewc:
    # During consolidation we usually keep the Fisher matrices from Phase 3.
    # The current implementation re‑computes them at regime transitions unless
    # we explicitly disable the update.  Setting ``lambda_base`` to ``0`` makes
    # the EWC penalty vanish, effectively freezing the Fisher information.
    lambda_base: 0.0
    beta_lambda: 0.0
    gamma_decay: 0.95
    # Optional flag – if the training code is extended to respect it, it can be
    # used to skip Fisher computation entirely.
    freeze: true
  pearl:
    # In Phase 4 we want to keep the PEARL regime encoder unchanged.  Setting the
    # learning rate to ``0`` disables any further updates, and the ``freeze``
    # flag can be used by the training loop to skip centroid re‑initialisation.
    lr: 0.0
    embedding_dim: 32
    hidden_dim: 128
    context_window: 20
    freeze: true
    # -----------------------------------------------------------------
    # Force the regime detector to use the *centroid* fallback rather than
    # the classification head.  The head is frozen (lr=0) and remains highly
    # confident, so with the default low confidence threshold it would always
    # dominate.  Raising the threshold to 0.95 makes the head’s confidence
    # rarely exceed the limit, causing the code to fall back to the pre‑
    # trained centroids that were loaded from the Phase‑3 checkpoint.
    # -----------------------------------------------------------------
    # Raise the confidence threshold so the classification head rarely passes.
    # A value of 0.99 makes it extremely unlikely to dominate, forcing the
    # centroid fallback to be used.
    detect_confidence_threshold: 0.99
    # Use a slightly tighter similarity threshold (0.05) to ensure centroids
    # are matched only when they are sufficiently close, reducing accidental
    # mismatches while still allowing the pre‑trained centroids to be used.
    detect_similarity_threshold: 0.05
    # If the similarity check still fails (e.g., due to noise), fall back to a
    # simple delta‑bucket assignment. This mirrors the behaviour of the original
    # training script where `allow_delta_bootstrap_fallback` was true.
    allow_delta_bootstrap_fallback: true

logging:
  log_dir: "runs/phase4_finetune/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10
  save_freq: 100

device: "auto"
seed: 42

# ---------------------------------------------------------------------------
# Adaptation‑speed evaluation (few‑shot MAML vs. training‑from‑scratch)
# ---------------------------------------------------------------------------
# This section defines the hyper‑parameters used by the new validation metric
# that measures how quickly a policy can adapt after a regime transition.
#
# * ``meta_checkpoint`` – checkpoint containing the *generalized* parameters
#   obtained from MAML meta‑training across all regimes.  The checkpoint is
#   expected to contain the same model architecture as the baseline SAC
#   policy.
# * ``inner_lr`` – learning rate for the inner (few‑shot) gradient updates.
# * ``inner_steps`` – number of gradient steps performed on the support set.
# * ``support_episodes`` – number of episodes (or trajectories) used as the
#   few‑shot adaptation data.
# * ``target_reward`` – performance threshold (as a fraction of the maximum
#   achievable reward for the regime) that defines “adapted”.  The metric will
#   report the number of episodes required to reach this threshold, or the
#   reward after the fixed number of inner steps if the threshold is not met.
# * ``baseline_episodes`` – number of episodes to train a fresh policy from
#   scratch on the same regime before measuring its reward.  This provides a
#   direct comparison to the MAML‑initialized policy.
#
# The validation script ``scripts/evaluate_adaptation_speed.py`` will read
# these values, perform the few‑shot updates, and write two entries to the
# JSON summary for the phase:
#   "adaptation_speed_maml": <episodes‑to‑target-or‑reward>
#   "adaptation_speed_scratch": <episodes‑to‑target-or‑reward>
# ---------------------------------------------------------------------------
adaptation:
  enabled: true
  meta_checkpoint: "runs/wind_cemrl_phase3_from_500/checkpoints/ep_02200.pt"
  inner_lr: 5.0e-4
  inner_steps: 5
  support_episodes: 10
  target_reward: 0.90   # 90 % of the regime‑specific optimal reward
  baseline_episodes: 200  # train from scratch for 200 episodes before evaluation
