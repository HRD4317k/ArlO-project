# HMARL-DRT Configuration — Wind Turbine Farm
# ================================================

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1                    # Simulation timestep (s)
  max_steps: 1000            # Steps per episode

  # Turbine physical parameters
  physics:
    J: 1000000.0              # Moment of inertia (kg·m²)
    B: 100.0                 # Friction coefficient
    R: 40.0                  # Rotor radius (m)
    rho: 1.225               # Air density (kg/m³)
    C_th: 5000.0             # Thermal capacitance
    h_conv: 10.0             # Convective heat transfer coeff

  # Constraint limits
  constraints:
    omega_min: 0.5           # Min rotor angular velocity (rad/s)
    omega_max: 1.5           # Max rotor angular velocity (rad/s)
    T_max: 100.0             # Max bearing temperature (°C)
    delta_crit: 0.9          # Critical degradation index

  # State space: [omega, v_wind, T_gen, T_bearing, P_out, delta, grid_demand, weather]
  state_dim: 8
  action_dim: 3              # [beta (pitch), torque_setpoint_delta, maintenance_flag]

# Agent configurations
agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2               # Initial entropy coefficient
    auto_entropy: true

  pinn:
    hidden_dim: 128
    lr: 1.0e-3
    lambda_ode: 1.0
    lambda_bc: 0.1

  gp:
    kernel: "matern52"
    n_inducing: 100
    lr: 0.01

  fm:
    model_name: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 256
    confidence_threshold: 0.7

# Core module configurations
embedding:
  shared_dim: 64
  agent_dims: [64, 32, 128, 64]   # NN, GP/iPAE, FM, PINN
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1.0e-3
  eta: 0.7                   # Competence-uncertainty tradeoff

reward:
  initial_weights:
    energy: 0.10
    rul: 0.20
    safety: 0.30
    physics: 0.30
    curiosity: 0.10
  kappa: 0.1                 # FM pull strength
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000

transfer:
  lambda_pn: 0.1             # Physics → NN
  lambda_ng: 0.05            # NN → GP
  lambda_gn: 0.05            # GP → NN
  lambda_np: 0.1             # NN → Physics
  lambda_fm: 0.02            # FM → All
  fm_confidence_threshold: 0.7

# Training
training:
  n_episodes: 1000
  batch_size: 256
  buffer_size: 1000000
  update_freq: 4             # Steps between updates
  warmup_steps: 1000
  eval_freq: 50              # Episodes between eval
  save_freq: 100

# iPAE pre-training
ipae:
  latent_dim: 8
  window_size: 64
  n_features: 14
  encoder_hidden: 128
  lstm_hidden: 256
  lstm_layers: 2
  rul_hidden: [64, 32, 16]
  mc_dropout: 0.1
  n_mc_samples: 50
  pretrain_epochs: 200
  pretrain_lr: 1.0e-3
  lambda_physics: 1.0
  lambda_rul: 1.0
  lambda_mono: 0.5
  lambda_kl: 0.01

# Logging
logging:
  log_dir: "runs/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10

# Device
device: "auto"               # auto, cpu, cuda, mps
seed: 42
