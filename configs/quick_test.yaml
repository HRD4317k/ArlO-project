# Quick Test Configuration
# Minimal episodes for rapid testing and debugging

device: "auto"
seed: 42

env:
  name: "WindTurbine"
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
  degradation:
    enabled: true
    initial_regime: 0
    transition_prob: 0.05

agents:
  sac:
    hidden_dim: 128
    lr_actor: 0.0003
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 64
    lr: 0.001
    lambda_physics: 1.0
  gp:
    lr: 0.01
    lengthscale_init: 1.0
    n_inducing: 50
  fm:
    window_size: 50
    anomaly_threshold: 2.5

embedding:
  shared_dim: 32
  lambda_orth: 0.01

arbiter:
  hidden_dim: 64
  temperature: 1.0
  lr: 0.001

cemrl:
  enabled: true
  ewc:
    lambda_base: 400.0
    beta_lambda: 0.1
    gamma_decay: 0.95
    fisher_samples: 128
  pearl:
    embedding_dim: 16
    context_window: 10
    hidden_dim: 64
    lr: 0.0003
    ema_alpha: 0.05
  cemrl_arbiter:
    hidden_dim: 64
    alpha_inner: 0.01
    alpha_outer: 0.001
    delta_kl: 0.01
    meta_update_freq: 50
  regime_detector:
    hysteresis_buffer: 5
    delta_threshold: 0.1
    uncertainty_threshold: 0.3

reward:
  initial_weights:
    energy: 0.5
    rul: 0.3
    safety: 0.1
    physics: 0.05
    curiosity: 0.05
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 5000
  phase_late_step: 15000

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 50          # Short run for testing
  batch_size: 128         # Smaller batch
  buffer_size: 50000      # Smaller buffer
  update_freq: 4
  warmup_steps: 100       # Quick warmup

logging:
  log_dir: "runs/quick_test"
  use_tensorboard: true
  print_freq: 5           # Print more frequently
  save_freq: 25
  track_fisher: true
  track_regime_clusters: true
  track_adaptation_time: true
