# Supervised CEMRL-HMARL configuration.
# Uses true degradation delta for regime identification while unsupervised
# PEARL clustering is being fixed.

env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  mask_true_delta: false
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 1000.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.98
  degradation:
    enabled: true
    sample_regime_each_episode: true
    initial_delta_min: 0.0
    initial_delta_max: 0.2
    regime_delta_ranges:
      "0": [0.0, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    regime_probs: [0.25, 0.25, 0.25, 0.25]

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3.0e-4
    lr_critic: 3.0e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 3.0e-4
    lambda_ode: 1.0
    lambda_bc: 0.1
  gp:
    lr: 1.0e-3
  fm:
    model_name: "gpt-4o-mini"
    temperature: 0.3
    confidence_threshold: 0.7
    use_api: false
    api_timeout_s: 8.0
    api_interval: 50

embedding:
  shared_dim: 64
  agent_dims: [128, 32, 128, 64]
  n_agents: 4
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 3.0e-4
  min_nn_weight: 0.10
  min_nn_weight_initial: 0.25
  curriculum_episodes: 100

reward:
  initial_weights:
    energy: 0.12
    rul: 0.12
    safety: 0.55
    physics: 0.16
    curiosity: 0.05
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000
  curiosity_norm: 100.0

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 1000
  batch_size: 256
  buffer_size: 200000
  update_freq: 4
  warmup_steps: 1000
  eval_freq: 100
  save_freq: 100
  warm_start_checkpoint: "runs/wind_cemrl_phase3_from_500/checkpoints/latest.pt"

cemrl:
  enabled: true
  # Supervised mode: true delta thresholds drive RegimeDetector.detect().
  use_latent_regime_detection: false
  mask_true_delta: false
  expose_true_delta_for_eval: true
  allow_delta_bootstrap_fallback: true
  n_latent_regimes: 4
  fisher_min_interval_steps: 3000
  delta_mask_value: 0.0

  ewc:
    lambda_base: 100.0
    beta_lambda: 0.1
    gamma_decay: 0.95

  pearl:
    embedding_dim: 32
    hidden_dim: 128
    context_window: 20
    lr: 3.0e-4
    detect_similarity_threshold: 0.10
    detect_confidence_threshold: 0.10
    ema_alpha: 0.15
    checkpoint: "pearl_supervised.pt"

  cemrl_arbiter:
    hidden_dim: 128
    alpha_inner: 0.01
    alpha_outer: 0.001
    delta_kl: 0.01
    meta_update_freq: 50

  enable_hatrpo_update: true
  enable_maml_outer_loop: true

  maml_warmstart:
    n_regimes: 4
    min_steps_before_save: 100
    blend_alpha: 0.80

  regime_detector:
    hysteresis_buffer: 10
    dwell_steps: 25

logging:
  log_dir: "runs/wind_cemrl_supervised/"
  use_tensorboard: true
  use_wandb: false
  print_freq: 10
  save_freq: 100

device: "auto"
seed: 42
