# Balanced fast configuration for HMARL‑DRT (Phase 3) 
# Goal: avoid the per‑episode slowdown observed with very large batches while keeping convergence speed high.
# Uses a moderate batch size and a modest number of parallel environments.

# ────────────────────────────────────────────────────────────────
# SYSTEM
# ────────────────────────────────────────────────────────────────
use_async_env: true
device: "auto"
seed: 42

# ────────────────────────────────────────────────────────────────
# ENVIRONMENT
# ────────────────────────────────────────────────────────────────
env:
  name: "WindTurbine-v0"
  n_turbines: 1
  dt: 0.1
  max_steps: 1000
  # Moderate parallelism – enough to keep data pipeline full without overwhelming CPU.
  num_envs: 8
  physics:
    J: 1000000.0
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 10.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    initial_regime: 0
    transition_prob: 0.01
    sample_regime_each_episode: true
    regime_probs: [0.45, 0.25, 0.20, 0.10]
    regime_delta_ranges:
      "0": [0.00, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    initial_delta_min: 0.00
    initial_delta_max: 0.20

# ────────────────────────────────────────────────────────────────
# AGENTS (same as main config)
# ────────────────────────────────────────────────────────────────
agents:
  sac:
    hidden_dim: 256
    lr_actor: 3e-4
    lr_critic: 3e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 1e-3
    lambda_physics: 1.0
    lambda_boundary: 0.5
  gp:
    lr: 0.01
    lengthscale_init: 1.0
    noise_init: 0.1
    n_inducing: 100
  fm:
    model_name: "gpt-4o-mini"
    temperature: 0.3
    confidence_threshold: 0.7
    use_api: true
    api_timeout_s: 8.0
    api_interval: 100

# ────────────────────────────────────────────────────────────────
# SHARED EMBEDDING
# ────────────────────────────────────────────────────────────────
embedding:
  shared_dim: 128   # slightly larger than baseline to keep representation capacity
  lambda_orth: 0.01

# ────────────────────────────────────────────────────────────────
# ARBITER
# ────────────────────────────────────────────────────────────────
arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1e-3
  min_nn_weight: 0.10
  min_nn_weight_initial: 0.40
  curriculum_episodes: 300

# ────────────────────────────────────────────────────────────────
# CEMRL SETTINGS (enabled for Phase 3)
# ────────────────────────────────────────────────────────────────
cemrl:
  enabled: true
  use_latent_regime_detection: true
  n_latent_regimes: 3
  mask_true_delta: false
  expose_true_delta_for_eval: true
  fisher_min_interval_steps: 3000
  ewc:
    lambda_base: 400.0
    beta_lambda: 0.1
    gamma_decay: 0.95
    fisher_samples: 256
    diagonal_approx: true
  pearl:
    embedding_dim: 8
    context_window: 20
    hidden_dim: 128
    lr: 3e-4
    pretrain_epochs: 0
    ema_alpha: 0.05
    centroid_init_noise: 0.10
    detect_similarity_threshold: 0.30
    detect_confidence_threshold: 0.20
  cemrl_arbiter:
    hidden_dim: 128
    alpha_inner: 0.01
    alpha_outer: 0.001
    delta_kl: 0.01
    meta_update_freq: 100
    n_inner_steps: 5
    task_buffer_size: 500
  regime_detector:
    hysteresis_buffer: 8
    dwell_steps: 200
    delta_threshold: 0.1
    uncertainty_threshold: 0.3
    adaptive_hysteresis: false

# ────────────────────────────────────────────────────────────────
# REWARD SHAPING
# ────────────────────────────────────────────────────────────────
reward:
  initial_weights:
    energy: 0.10
    rul: 0.20
    safety: 0.30
    physics: 0.30
    curiosity: 0.10
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  curiosity_norm: 100.0
  phase_mid_step: 50000
  phase_late_step: 150000

# ────────────────────────────────────────────────────────────────
# TRANSFER LEARNING
# ────────────────────────────────────────────────────────────────
transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

# ────────────────────────────────────────────────────────────────
# TRAINING
# ────────────────────────────────────────────────────────────────
training:
  n_episodes: 5000          # enough for convergence
  batch_size: 4096          # moderate batch – avoids GPU memory spikes & slowdown
  buffer_size: 500000       # smaller buffer reduces memory pressure
  update_freq: 4            # optimizer step every 4 env steps
  warmup_steps: 1000
  eval_freq: 50
  save_freq: 100

# ────────────────────────────────────────────────────────────────
# LOGGING
# ────────────────────────────────────────────────────────────────
logging:
  log_dir: "runs/"
  use_tensorboard: true
  print_freq: 100
  save_freq: 500
