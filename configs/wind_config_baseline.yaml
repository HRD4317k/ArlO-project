# Baseline configuration for HMARL‑DRT (original high‑performance settings)
# Used for comparison against the balanced fast config.

use_async_env: true

device: "auto"
seed: 42

env:
  name: "WindTurbine"
  # Use a moderate number of parallel environments to keep the data pipeline full
  # while avoiding the CPU/GPU overhead that caused slowdown in the previous runs.
  num_envs: 8
  physics:
    J: 1e6
    B: 100.0
    R: 40.0
    rho: 1.225
    C_th: 5000.0
    h_conv: 10.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_max: 100.0
    delta_crit: 0.9
  degradation:
    enabled: true
    initial_regime: 0
    transition_prob: 0.01
    sample_regime_each_episode: true
    regime_probs: [0.25, 0.25, 0.25, 0.25]
    regime_delta_ranges:
      "0": [0.00, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    initial_delta_min: 0.00
    initial_delta_max: 0.20

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3e-4
    lr_critic: 3e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 1e-3
    lambda_physics: 1.0
    lambda_boundary: 0.5
  gp:
    lr: 0.01
    lengthscale_init: 1.0
    noise_init: 0.1
    n_inducing: 100
  fm:
    model_name: "gpt-oss-120b"
    temperature: 0.3
    confidence_threshold: 0.8
    use_api: true
    api_timeout_s: 15.0
    api_interval: 100

embedding:
  shared_dim: 128
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1e-3
  min_nn_weight: 0.10
  min_nn_weight_initial: 0.40
  curriculum_episodes: 300

cemrl:
  # Disabled for pure HMARL baseline – CEMRL components are turned off.
  enabled: false

reward:
  initial_weights:
    energy: 0.10
    rul: 0.20
    safety: 0.30
    physics: 0.30
    curiosity: 0.10
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  curiosity_norm: 100.0
  phase_mid_step: 50000
  phase_late_step: 150000

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 5000
  # Moderate batch size – fits comfortably in GPU memory and prevents per‑episode
  # time growth while still providing low‑variance gradient estimates.
  batch_size: 4096
  # Larger replay buffer gives more diverse experience without overwhelming memory.
  buffer_size: 500000
  update_freq: 4
  warmup_steps: 1000
  eval_freq: 50
  save_freq: 100

logging:
  # Separate log directory for the pure HMARL baseline run.
  log_dir: "runs/baseline_hmarl"
  use_tensorboard: true
  print_freq: 10
