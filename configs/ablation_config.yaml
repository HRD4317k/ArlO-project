# CEMRL-HMARL Ablation Study Configuration
# Enables/disables individual CEMRL components for ablation analysis

# Inherits from: wind_config.yaml
# Override only the components you want to ablate

# ═══════════════════════════════════════════════════════════════
# ABLATION SCENARIOS
# ═══════════════════════════════════════════════════════════════
# Uncomment the scenario you want to test:

# ───────────────────────────────────────────────────────────────
# Scenario 1: CEMRL-Full (all components enabled)
# ───────────────────────────────────────────────────────────────
device: "auto"
seed: 42

env:
  name: "WindTurbine"
  physics: {J: 1e6, B: 100.0, R: 40.0}
  constraints: {omega_min: 0.5, omega_max: 1.5, T_max: 100.0}
  degradation: {enabled: true, initial_regime: 0, transition_prob: 0.01}

agents:
  sac: {hidden_dim: 256, lr_actor: 3e-4, gamma: 0.99, tau: 0.005, alpha: 0.2, auto_entropy: true}
  pinn: {hidden_dim: 128, lr: 1e-3, lambda_physics: 1.0}
  gp: {lr: 0.01, lengthscale_init: 1.0, n_inducing: 100}
  fm: {window_size: 50, anomaly_threshold: 2.5}

embedding: {shared_dim: 64, lambda_orth: 0.01}
arbiter: {hidden_dim: 128, temperature: 1.0, lr: 1e-3}

cemrl:
  enabled: true
  ewc: {lambda_base: 400.0, beta_lambda: 0.1, gamma_decay: 0.95, fisher_samples: 256}
  pearl: {embedding_dim: 32, context_window: 20, hidden_dim: 128, lr: 3e-4, ema_alpha: 0.05}
  cemrl_arbiter: {hidden_dim: 128, alpha_inner: 0.01, alpha_outer: 0.001, delta_kl: 0.01, meta_update_freq: 100}
  regime_detector: {hysteresis_buffer: 10, delta_threshold: 0.1, uncertainty_threshold: 0.3}

reward:
  initial_weights: {power: 0.5, health: 0.3, efficiency: 0.1, stability: 0.1}
  kappa: 0.1
  lambda_entropy: 0.01
  phase_mid_step: 50000
  phase_late_step: 150000

transfer: {lambda_pn: 0.1, lambda_ng: 0.05, lambda_gn: 0.05, lambda_np: 0.1, lambda_fm: 0.02, fm_confidence_threshold: 0.7}
training: {n_episodes: 1000, batch_size: 256, buffer_size: 1000000, update_freq: 4, warmup_steps: 1000}
logging: {log_dir: "runs/cemrl_full", use_tensorboard: true, print_freq: 10, save_freq: 100}


