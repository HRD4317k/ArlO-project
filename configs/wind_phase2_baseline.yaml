# Phase 2 baseline configuration (CEMRL disabled)
# This file is a copy of the main wind_config.yaml with the CEMRL stack turned off.

device: "auto"
seed: 42

env:
  name: "WindTurbine"
  num_envs: 30               # keep the CPU speed‑up we applied earlier
  physics:
    J: 1e6
    B: 100.0
    R: 40.0
  constraints:
    omega_min: 0.5
    omega_max: 1.5
    T_min: 0.0
    T_max: 100.0
  degradation:
    enabled: true
    initial_regime: 0
    transition_prob: 0.01
    sample_regime_each_episode: true
    regime_probs: [0.45, 0.25, 0.20, 0.10]
    regime_delta_ranges:
      "0": [0.00, 0.25]
      "1": [0.25, 0.50]
      "2": [0.50, 0.75]
      "3": [0.75, 0.95]
    initial_delta_min: 0.00
    initial_delta_max: 0.20

agents:
  sac:
    hidden_dim: 256
    lr_actor: 3e-4
    lr_critic: 3e-4
    gamma: 0.99
    tau: 0.005
    alpha: 0.2
    auto_entropy: true
  pinn:
    hidden_dim: 128
    lr: 1e-3
    lambda_physics: 1.0
    lambda_boundary: 0.5
  gp:
    lr: 0.01
    lengthscale_init: 1.0
    noise_init: 0.1
    n_inducing: 100
  fm:
    window_size: 50
    anomaly_threshold: 2.5
    model_name: "gpt-4o-mini"
    temperature: 0.3
    confidence_threshold: 0.7
    use_api: false
    api_timeout_s: 8.0
    api_interval: 250

embedding:
  shared_dim: 64
  lambda_orth: 0.01

arbiter:
  hidden_dim: 128
  temperature: 1.0
  lr: 1e-3
  min_nn_weight: 0.10
  min_nn_weight_initial: 0.40
  curriculum_episodes: 300

cemrl:
  enabled: false   # <-- disable CEMRL, PEARL, EWC, regime detector for Phase 2

reward:
  initial_weights:
    energy: 0.10
    rul: 0.20
    safety: 0.30
    physics: 0.30
    curiosity: 0.10
  kappa: 0.1
  lambda_entropy: 0.01
  alpha_rul: 0.01
  curiosity_norm: 100.0
  phase_mid_step: 50000
  phase_late_step: 150000

transfer:
  lambda_pn: 0.1
  lambda_ng: 0.05
  lambda_gn: 0.05
  lambda_np: 0.1
  lambda_fm: 0.02
  fm_confidence_threshold: 0.7

training:
  n_episodes: 3000          # Phase 2 length (as we set earlier)
  batch_size: 18000
  buffer_size: 1000000
  update_freq: 8
  warmup_steps: 1000

logging:
  log_dir: "runs/"
  use_tensorboard: true
  print_freq: 500
  save_freq: 1000
  track_fisher: true
  track_regime_clusters: true
  track_adaptation_time: true
